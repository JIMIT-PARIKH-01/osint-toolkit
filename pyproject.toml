[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-toolkit"
version = "1.0.0"
description = "OSINT: DNS recon, WHOIS/IP intel, username checker (GUI + CLI)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jimit Devangkumar Parikh" }]

[project.urls]
Homepage = "https://github.com/JIMIT-PARIKH-01/osint-toolkit"

[project.scripts]
osint = "osint.cli:main"

[tool.setuptools]
packages = ["osint"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
